<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JoyKiss Pistore</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

  <h2>JoyKiss Pistore</h2>
  <button onclick="payWithPi()">Bayar dengan Pi</button>

  <script>
    // 🔥 WAJIB: inisialisasi Pi SDK
    Pi.init({
      version: "2.0",
      sandbox: true   // ⚠️ true = testnet, false = mainnet
    });

    async function payWithPi() {
      try {
        const payment = Pi.createPayment({
          amount: 1, // jumlah Pi
          memo: "Pembelian Produk JoyKiss",
          metadata: {
            orderId: "ORDER_" + Date.now()
          }
        }, {

          // 1️⃣ saat payment dibuat
          onReadyForServerApproval: async function(paymentId) {
            console.log("APPROVAL:", paymentId);

            await fetch('/api/create', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ paymentId })
            });
          },

          // 2️⃣ saat siap diselesaikan
          onReadyForServerCompletion: async function(paymentId, txid) {
            console.log("COMPLETE:", paymentId, txid);

            const res = await fetch('/api/complete', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                paymentId: paymentId,
                txid: txid   // 🔴 WAJIB!
              })
            });

            const data = await res.json();
            console.log("COMPLETE RESULT:", data);
          },

          // 3️⃣ jika sukses
          onSuccess: function(payment) {
            alert("Pembayaran berhasil!");
            console.log(payment);
          },

          // 4️⃣ jika dibatalkan
          onCancel: function(payment) {
            alert("Pembayaran dibatalkan");
            console.log(payment);
          },

          // 5️⃣ jika error
          onError: function(error) {
            alert("Terjadi error");
            console.error(error);
          }

        });

      } catch (err) {
        console.error("ERROR PAY:", err);
      }
    }
  </script>

</body>
</html>
