<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>JoyKiss Pistore</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

  <h2>JoyKiss Pistore</h2>

  <button onclick="loginPi()">Login dengan Pi</button>
  <button onclick="payWithPi()">Bayar dengan Pi</button>

  <p id="status">Belum login</p>

  <script>
    Pi.init({
      version: "2.0",
      sandbox: true
    });

    let currentUser = null;

    // 🔐 LOGIN + AUTO HANDLE PENDING
    async function loginPi() {
      try {
        const scopes = ['username', 'payments'];

        const auth = await Pi.authenticate(scopes, async function(payment) {
          console.log("🔥 Pending ditemukan:", payment);

          if (!payment || !payment.identifier) return;

          try {
            // 🔴 AUTO COMPLETE
            const res = await fetch('/api/complete', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                paymentId: payment.identifier,
                txid: payment.transaction?.txid
              })
            });

            const data = await res.json();
            console.log("✅ Pending diselesaikan:", data);

          } catch (err) {
            console.error("❌ Gagal auto-complete:", err);
          }
        });

        currentUser = auth.user;

        document.getElementById("status").innerText =
          "Login sukses: " + currentUser.username;

        console.log("User:", currentUser);

      } catch (err) {
        console.error(err);
        alert("Login gagal");
      }
    }

    // 💰 BAYAR
    async function payWithPi() {

      if (!currentUser) {
        alert("Silakan login dulu!");
        return;
      }

      Pi.createPayment({
        amount: 1,
        memo: "Pembelian JoyKiss",
        metadata: {
          orderId: "ORDER_" + Date.now()
        }
      }, {

        // APPROVAL
        onReadyForServerApproval: async function(paymentId) {
          console.log("APPROVAL:", paymentId);

          await fetch('/api/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId })
          });
        },

        // COMPLETE
        onReadyForServerCompletion: async function(paymentId, txid) {
          console.log("COMPLETE:", paymentId, txid);

          await fetch('/api/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId, txid })
          });
        },

        // SUCCESS
        onSuccess: function(payment) {
          alert("Pembayaran sukses!");
          console.log(payment);
        },

        // CANCEL
        onCancel: function(payment) {
          alert("Dibatalkan");
        },

        // ERROR
        onError: function(error) {
          console.error(error);
          alert("Error pembayaran");
        }

      });
    }
  </script>

</body>
</html>
