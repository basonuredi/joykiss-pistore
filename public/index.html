<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>JoyKiss Pistore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body style="text-align:center; font-family:Arial; padding:50px;">

  <h1>JoyKiss Pistore</h1>

  <button onclick="loginPi()" style="padding:15px; font-size:18px;">
    Login Pi
  </button>

  <br><br>

  <button onclick="bayarPi()" style="padding:15px; font-size:18px;">
    Bayar dengan Pi
  </button>

  <p id="status"></p>

  <script>
    let piUser = null;

    window.onload = function () {
      if (!window.Pi) {
        document.getElementById("status").innerText = "❌ Buka di Pi Browser";
        return;
      }

      window.Pi.init({ version: "2.0" });
      document.getElementById("status").innerText = "✅ Pi SDK siap";
    };

    async function loginPi() {
      try {
        const auth = await window.Pi.authenticate(['username', 'payments']);
        piUser = auth;

        document.getElementById("status").innerText =
          "✅ Login: " + auth.user.username;

      } catch (error) {
        document.getElementById("status").innerText =
          "❌ Login gagal";
      }
    }

    function bayarPi() {
      if (!piUser) {
        alert("Login dulu");
        return;
      }

      window.Pi.createPayment(
        {
          amount: 0.01,
          memo: "Test JoyKiss",
          metadata: {}
        },
        {
          onReadyForServerApproval: function(paymentId) {
            fetch('/api/approve', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ paymentId })
            });
          },

          onReadyForServerCompletion: function(paymentId, txid) {
            fetch('/api/complete', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ paymentId, txid })
            });

            alert("✅ Transaksi berhasil");
          },

          onCancel: function() {
            alert("❌ Dibatalkan");
          },

          onError: function(error) {
            alert("❌ Error: " + JSON.stringify(error));
          }
        }
      );
    }
  </script>

</body>
</html>
