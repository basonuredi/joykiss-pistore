<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>JoyKiss Pistore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="text-align:center; font-family:Arial; padding:50px;">

  <h1>JoyKiss Pistore</h1>

  <button onclick="loginPi()" style="padding:15px; font-size:18px;">
    Login Pi
  </button>

  <br><br>

  <button onclick="bayarPi()" style="padding:15px; font-size:18px;">
    Bayar dengan Pi
  </button>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <script>
    let Pi;
    let piUser = null;

    // 🔥 INIT SAAT HALAMAN DIBUKA
    window.onload = function () {
      Pi = window.Pi;

      if (!Pi) {
        alert("❌ Pi SDK tidak terdeteksi");
        return;
      }

      Pi.init({ version: "2.0" });
      console.log("✅ Pi SDK siap");
    };

    function loginPi() {
      alert("Klik login");

      if (!Pi) {
        alert("❌ SDK belum siap");
        return;
      }

      Pi.authenticate(['payments'], function(auth) {
        piUser = auth;
        alert("✅ Login berhasil");
      }, function(error) {
        alert("❌ Login gagal: " + JSON.stringify(error));
      });
    }

    function bayarPi() {
      if (!piUser) {
        alert("❌ Silakan login dulu");
        return;
      }

      alert("Mulai Payment");

      Pi.createPayment(
        {
          amount: 0.01,
          memo: "JoyKiss Test",
          metadata: {}
        },
        {
          onReadyForServerApproval: function(paymentId) {
            alert("➡️ APPROVAL");

            fetch('/api/approve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId })
            });
          },

          onReadyForServerCompletion: function(paymentId, txid) {
            alert("✅ TX: " + txid);

            fetch('/api/complete', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId, txid })
            });
          },

          onCancel: function() {
            alert("❌ Dibatalkan");
          },

          onError: function(error) {
            alert("❌ Error: " + JSON.stringify(error));
          }
        }
      );
    }
  </script>

</body>
</html>
