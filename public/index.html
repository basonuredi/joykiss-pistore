<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>JoyKiss Pistore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="text-align:center; font-family:Arial; padding:50px;">

  <h1>JoyKiss Pistore</h1>

  <!-- TOMBOL -->
  <button onclick="bayarPi()" style="padding:15px 30px; font-size:18px;">
    Bayar dengan Pi
  </button>

  <!-- SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
function bayarPi() {
  alert("Mulai");

  const Pi = window.Pi;

  if (!Pi) {
    alert("SDK tidak aktif");
    return;
  }

  Pi.init({ version: "2.0", sandbox: true });

  Pi.authenticate(['payments']).then(function(auth) {
    alert("Login OK");

    return Pi.createPayment({
      amount: 0.01,
      memo: "Test",
      metadata: {}
    });
  }).then(function(payment) {
    alert("Payment object muncul");
  }).catch(function(error) {
    alert("ERROR: " + JSON.stringify(error));
  });
}
</script>

</body>
</html>
