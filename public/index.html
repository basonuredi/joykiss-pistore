<script>
function bayarPi() {
  alert("Mulai");

  const Pi = window.Pi;

  if (!Pi) {
    alert("SDK tidak aktif");
    return;
  }

  Pi.init({ version: "2.0" });

  Pi.createPayment(
    {
      amount: 0.01,
      memo: "Test",
      metadata: {}
    },
    {
      onReadyForServerApproval: function(paymentId) {
        alert("APPROVAL");

        fetch('/api/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId })
        });
      },

      onError: function(error) {
        alert("ERROR: " + JSON.stringify(error));
      }
    }
  );
}
</script>
