
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>JoyKiss Pistore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body style="text-align:center; font-family:Arial; padding:50px;">

  <h1>JoyKiss Pistore</h1>

  <button onclick="loginPi()" style="padding:15px; font-size:18px;">
    Login Pi
  </button>

  <p id="status"></p>

  <script>
    let piUser = null;

    // INIT
    window.onload = function () {
      if (!window.Pi) {
        document.getElementById("status").innerText = "❌ Buka di Pi Browser";
        return;
      }

      window.Pi.init({ version: "2.0" });
      document.getElementById("status").innerText = "✅ Pi SDK siap";
    };

    // LOGIN
    async function loginPi() {
      try {
        const auth = await window.Pi.authenticate(['username']);
        piUser = auth;

        document.getElementById("status").innerText =
          "✅ Login berhasil: " + auth.user.username;

      } catch (error) {
        document.getElementById("status").innerText =
          "❌ Login gagal";
      }
    }
  </script>

</body>
</html>
