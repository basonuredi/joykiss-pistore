<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>JoyKiss Pistore</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

  <h2>JoyKiss Pistore</h2>

  <button onclick="loginPi()">Login dengan Pi</button>
  <button onclick="payWithPi()">Bayar dengan Pi</button>

  <p id="status"></p>

  <script>
    Pi.init({
      version: "2.0",
      sandbox: true
    });

    let currentUser = null;

    // 🔐 LOGIN
    async function loginPi() {
      try {
        const scopes = ['username', 'payments'];

        const auth = await Pi.authenticate(scopes, function(payment) {
          console.log("Incomplete payment found:", payment);
        });

        currentUser = auth.user;
        document.getElementById("status").innerText =
          "Login sukses: " + currentUser.username;

        console.log("User:", currentUser);

      } catch (err) {
        console.error(err);
        alert("Login gagal");
      }
    }

    // 💰 BAYAR
    async function payWithPi() {

      if (!currentUser) {
        alert("Silakan login dulu!");
        return;
      }

      Pi.createPayment({
        amount: 1,
        memo: "Pembelian JoyKiss",
        metadata: { orderId: Date.now() }
      }, {

        onReadyForServerApproval: async function(paymentId) {
          await fetch('/api/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId })
          });
        },

        onReadyForServerCompletion: async function(paymentId, txid) {
          await fetch('/api/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId, txid })
          });
        },

        onSuccess: function(payment) {
          alert("Pembayaran sukses!");
        },

        onCancel: function(payment) {
          alert("Dibatalkan");
        },

        onError: function(error) {
          console.error(error);
          alert("Error pembayaran");
        }

      });
    }
  </script>

</body>
</html>
